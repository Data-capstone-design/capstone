services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: technote-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - technote-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: technote-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: technote-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://technote-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"   # Docker 네트워크 내부용 포트
      - "29092:29092" # 외부 클라이언트용 포트
    networks:
      - technote-network

  mongodb:
    image: mongo:7
    container_name: technote-mongo
    ports:
      - "27017:27017"
    networks:
      - technote-network
    volumes:
      - mongo-data:/data/db

networks:
  technote-network:
    external: true

volumes:
  mongo-data: